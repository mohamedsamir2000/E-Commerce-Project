# Default settings. Any key can be overridden on the command line, e.g. -Dheadless=true
base.url=https://www.saucedemo.com/
default.password=secret_sauce
headless=false
timeout.seconds=10
# Screen recording of each scenario (live video of the browser, saved to target/videos and attached to the reports)
#   all    = keep the video of every scenario
#   failed = keep the video only when the scenario fails
#   off    = do not record
video=all
# Screenshot attached to the reports: failed = only when the scenario fails, all = at the end of every scenario
screenshot=failed
